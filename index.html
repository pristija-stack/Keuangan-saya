<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Keuangan Saya</title>
<style>
body{margin:0;background:#f3f4f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827}
header{background:#111827;color:white;padding:18px 15px}h1{margin:0;font-size:22px}main{max-width:700px;margin:auto;padding:12px}
.card{background:white;border-radius:15px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px #0001}
h2{font-size:17px;margin:0 0 12px}.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.box{background:#f8fafc;padding:10px;border-radius:10px}.box small{display:block;color:#64748b}.box b{font-size:17px}
input,select,button{width:100%;padding:12px;border-radius:10px;border:1px solid #d1d5db;font-size:16px;box-sizing:border-box}button{background:#111827;color:white;border:0;font-weight:bold}.gray{background:#e5e7eb;color:#111827}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:10px}
.group{border:1px solid #e5e7eb;border-radius:12px;margin:8px 0;overflow:hidden}.title{padding:10px;background:#f9fafb;font-weight:bold}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:8px}.stats div{background:#f8fafc;padding:7px;font-size:11px;border-radius:7px}.stats b{display:block;font-size:13px;margin-top:3px}.in{color:#15803d}.out{color:#dc2626}
.item{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #eee;font-size:13px}.item small{display:block;color:#64748b;margin-top:3px}.empty{text-align:center;color:#64748b;padding:15px}
@media(max-width:600px){.sum,.grid,.actions{grid-template-columns:1fr}}
</style></head>
<body>
<header><h1>💰 Keuangan Saya</h1><div>Uang masuk • keluar • sisa dana</div></header>
<main>
<section class="card"><h2>📊 Rekap Keseluruhan</h2><div class="sum">
<div class="box"><small>UANG MASUK</small><b id="tin">Rp0</b></div>
<div class="box"><small>UANG KELUAR</small><b id="tout">Rp0</b></div>
<div class="box"><small>SISA DANA</small><b id="bal">Rp0</b></div>
</div></section>

<section class="card"><h2>➕ Tambah Transaksi</h2>
<div class="grid">
<div><small>Nominal</small><input id="nom" type="number" inputmode="numeric" placeholder="1000000"></div>
<div><small>Jenis</small><select id="typ"><option value="in">Uang Masuk</option><option value="out">Uang Keluar</option></select></div>
</div>
<small>Keterangan</small><input id="desc" placeholder="Barang Karawang">
<small>Tanggal</small><input id="date" type="date">
<div class="actions"><button onclick="add()">Simpan</button><button class="gray" onclick="clearForm()">Bersihkan</button></div>
</section>

<section class="card"><h2>📁 Rekap Per Keterangan</h2><div id="groups"></div></section>
<section class="card"><h2>🧾 Riwayat Transaksi</h2><div id="history"></div>
<button class="gray" onclick="backup()">Backup Data</button>
<input id="file" type="file" accept=".json" style="display:none" onchange="restore(event)">
<button class="gray" style="margin-top:7px" onclick="file.click()">Restore Data</button>
</section>
</main>
<script>
let data=JSON.parse(localStorage.getItem("keuanganSaya")||"[]");
const rp=n=>"Rp"+Number(n||0).toLocaleString("id-ID");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
date.value=new Date().toISOString().slice(0,10);
function save(){localStorage.setItem("keuanganSaya",JSON.stringify(data));render()}
function add(){let n=Number(nom.value),t=typ.value,k=desc.value.trim(),d=date.value||new Date().toISOString().slice(0,10);if(n<=0||!k){alert("Isi nominal dan keterangan.");return}data.push({id:Date.now()+Math.random(),n,t,k,d});save();clearForm()}
function clearForm(){nom.value="";desc.value=""}
function remove(id){data=data.filter(x=>x.id!==id);save()}
function render(){
let i=data.filter(x=>x.t=="in").reduce((s,x)=>s+x.n,0),o=data.filter(x=>x.t=="out").reduce((s,x)=>s+x.n,0);
tin.textContent=rp(i);tout.textContent=rp(o);bal.textContent=rp(i-o);
let g={};data.forEach(x=>{let k=x.k.toLowerCase();if(!g[k])g[k]={name:x.k,i:0,o:0};g[k][x.t]+=x.n});
groups.innerHTML=Object.values(g).map(q=>`<div class="group"><div class="title">${esc(q.name)}</div><div class="stats"><div>Masuk<b class="in">${rp(q.i)}</b></div><div>Keluar<b class="out">${rp(q.o)}</b></div><div>Sisa<b>${rp(q.i-q.o)}</b></div></div></div>`).join("")||'<div class="empty">Belum ada data.</div>';
history.innerHTML=data.slice().sort((a,b)=>b.d.localeCompare(a.d)).map(x=>`<div class="item"><div><b>${esc(x.k)}</b><small>${x.d} · ${x.t=="in"?"Uang Masuk":"Uang Keluar"}</small></div><div><b class="${x.t=="in"?"in":"out"}">${x.t=="in"?"+":"-"}${rp(x.n)}</b><br><button style="width:auto;padding:4px 8px;margin-top:4px;background:#fee2e2;color:#991b1b" onclick="remove(${x.id})">Hapus</button></div></div>`).join("")||'<div class="empty">Belum ada transaksi.</div>';
}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:"application/json"}));a.download="backup-keuangan.json";a.click()}
function restore(e){let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();alert("Data berhasil dipulihkan")}catch(x){alert("File tidak valid")}};r.readAsText(e.target.files[0])}
render();
</script></body></html>
