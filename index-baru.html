<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Keuangan Saya</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;margin:0;color:#111827}header{background:#111827;color:white;padding:18px}main{max-width:700px;margin:auto;padding:12px}.c{background:white;padding:15px;border-radius:15px;margin-bottom:12px;box-shadow:0 2px 8px #0001}h2{font-size:17px}.sum,.row,.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.box,.stats div{background:#f8fafc;padding:10px;border-radius:9px}.box small,.stats div{font-size:11px;color:#64748b}.box b,.stats b{display:block;font-size:17px;color:#111827;margin-top:4px}.in{color:#15803d!important}.out{color:#dc2626!important}input,select,button{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;font-size:16px;box-sizing:border-box;margin-top:5px}button{background:#111827;color:white;border:0;font-weight:bold}.actions{display:grid;grid-template-columns:2fr 1fr;gap:8px;margin-top:10px}.g{border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;margin:8px 0}.gt{padding:10px;background:#f9fafb;font-weight:bold}.item{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:9px;font-size:13px}.empty{text-align:center;color:#64748b;padding:15px}@media(max-width:600px){.sum,.row,.stats,.actions{grid-template-columns:1fr}}
</style><header><h1>💰 Keuangan Saya</h1><small>Rekap keseluruhan & per keterangan</small></header><main>
<div class="c"><h2>📊 Rekap Keseluruhan</h2><div class="sum"><div class="box"><small>UANG MASUK</small><b id="I">Rp0</b></div><div class="box"><small>UANG KELUAR</small><b id="O">Rp0</b></div><div class="box"><small>SISA DANA</small><b id="B">Rp0</b></div></div></div>
<div class="c"><h2>➕ Tambah Transaksi</h2><div class="row"><div><small>Nominal</small><input id="N" type="number" inputmode="numeric" placeholder="1000000"></div><div><small>Jenis</small><select id="T"><option value="in">Uang Masuk</option><option value="out">Uang Keluar</option></select></div><div><small>Tanggal</small><input id="D" type="date"></div></div><small>Keterangan</small><input id="K" placeholder="Barang Karawang"><div class="actions"><button onclick="add()">Simpan</button><button onclick="clr()" style="background:#e5e7eb;color:#111827">Bersihkan</button></div></div>
<div class="c"><h2>📁 Rekap Per Keterangan</h2><div id="G"></div></div>
<div class="c"><h2>🧾 Riwayat</h2><div id="H"></div><button onclick="backup()">Backup Data</button><input id="F" type="file" accept=".json" style="display:none" onchange="restore(event)"><button onclick="F.click()" style="margin-top:7px;background:#e5e7eb;color:#111827">Restore Data</button></div>
</main><script>
let x=JSON.parse(localStorage.getItem("KS")||"[]");D.value=new Date().toISOString().slice(0,10);
const R=n=>"Rp"+Number(n).toLocaleString("id-ID"),E=s=>String(s).replace(/[&<>"]/g,a=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[a]));
function save(){localStorage.setItem("KS",JSON.stringify(x));show()}
function add(){let n=+N.value,k=K.value.trim(),t=T.value,d=D.value;if(n<=0||!k)return alert("Isi nominal dan keterangan.");x.push({id:Date.now()+Math.random(),n,k,t,d});save();clr()}
function clr(){N.value="";K.value=""}
function del(id){x=x.filter(a=>a.id!==id);save()}
function show(){let i=0,o=0,g={};x.forEach(a=>{if(a.t==="in")i+=a.n;else o+=a.n;let q=a.k.trim().toLowerCase();if(!g[q])g[q]={n:a.k,i:0,o:0};if(a.t==="in")g[q].i+=a.n;else g[q].o+=a.n});I.textContent=R(i);O.textContent=R(o);B.textContent=R(i-o);
G.innerHTML=Object.values(g).map(q=>'<div class="g"><div class="gt">'+E(q.n)+'</div><div class="stats"><div>Masuk<b class="in">'+R(q.i)+'</b></div><div>Keluar<b class="out">'+R(q.o)+'</b></div><div>Sisa<b>'+R(q.i-q.o)+'</b></div></div></div>').join("")||'<div class="empty">Belum ada transaksi.</div>';
H.innerHTML=x.slice().sort((a,b)=>b.d.localeCompare(a.d)).map(a=>'<div class="item"><span><b>'+E(a.k)+'</b><br><small>'+a.d+' · '+(a.t==="in"?"Uang Masuk":"Uang Keluar")+'</small></span><b class="'+(a.t==="in"?"in":"out")+'">'+(a.t==="in"?"+":"-")+R(a.n)+'<br><button onclick="del('+a.id+')" style="width:auto;padding:4px 7px;background:#fee2e2;color:#991b1b">Hapus</button></b></div>').join("")||'<div class="empty">Belum ada transaksi.</div>'}
function backup(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(x,null,2)],{type:"application/json"}));a.download="backup-keuangan.json";a.click()}
function restore(e){let r=new FileReader;r.onload=()=>{try{x=JSON.parse(r.result);save();alert("Data berhasil dipulihkan")}catch(_){alert("Backup tidak valid")}};r.readAsText(e.target.files[0])}show();
</script>
